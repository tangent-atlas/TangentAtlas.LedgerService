# Dependabot: weekly pull requests for out-of-date NuGet packages and GitHub Actions, one pull request per ecosystem
# (packages that release together, such as .NET's, move together).  We take the latest release of every package, majors
# included, and fall back only on a real problem.  Security updates for known vulnerabilities are separate
# and immediate (turned on in the repository's settings).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
