name: Deploy to Production

# TEMPORARY branch-based gate, deliberately chosen for simplicity over the
# next 2-3 months rather than paying for GitHub Team's required-PR-review
# branch protection right now. Deploys on every push to the 'production'
# branch specifically - main itself does NOT trigger this, so an ordinary
# push to main is inert here. Promote code to production with:
#   git checkout production && git merge main && git push origin production
# workflow_dispatch stays available too, as a manual re-run/fallback path -
# harmless to keep alongside the branch trigger.
#
# THE HONEST TRADE-OFF: a merge into 'production' is a deliberate action,
# but it is NOT a reviewed one - anyone with push access can do it alone,
# same as clicking workflow_dispatch could. This is knowingly accepted for
# now, given team size and the pre-revenue stage. Revisit once the org
# upgrades to GitHub Team: switch back to a single `main` branch, add
# required-PR-review branch protection there (Settings -> Branches ->
# main -> Require a pull request before merging -> Require approvals,
# with Include administrators on), and delete the 'staging'/'production'
# branches entirely - deploy-staging.yml/deploy-production.yml would
# revert to triggering off `main` and workflow_dispatch respectively, the
# way they did before this change.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login - no client secret anywhere
  contents: read

env:
  AZURE_WEBAPP_NAME: website-tangentatlas-ledger-production
  SQL_SERVER_NAME: sqlserver-tangentatlas-platform-production
  SQL_DATABASE_NAME: database-tangentatlas-ledger-production
  SQL_RESOURCE_GROUP: resourcegroup-tangentatlas-production
  DOTNET_VERSION: '10.0.x'

jobs:
  migrate-database:
    # Runs BEFORE deploy, deliberately, using a SEPARATE identity from the
    # one that deploys code below - see Deploy-ManagedIdentities.ps1's
    # migrator entries. That identity never touches the Web App at all; its
    # only privilege is db_ddladmin/db_datareader/db_datawriter on this one
    # database (Deploy-AtlasDatabase.ps1) plus 'SQL Security Manager' on the
    # SQL server itself, for the firewall-rule steps below (an ARM
    # operation, not covered by the data-plane grant). The app's own
    # runtime identity (used by build-and-deploy's Web App) never has DDL
    # rights, ever.
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore pinned dotnet tools (dotnet-ef)
        run: dotnet tool restore

      - name: Restore project dependencies
        # Separate from the tool restore above - this restores
        # TangentAtlas.LedgerService's own NuGet package references
        # (AtlasLedger.Model, EF Core, etc.), without which `dotnet ef`
        # has no project.assets.json to load and fails with NETSDK1004.
        run: dotnet restore TangentAtlas.LedgerService/TangentAtlas.LedgerService.csproj

      - name: Generate idempotent migration script
        # No live database connection needed here - this only reads the
        # compiled Migration classes (from AtlasLedger.Model, via
        # LedgerContextFactory's design-time construction) and emits SQL
        # text. Deliberately does NOT touch this app's own Program.cs
        # hosting/auth setup - that's the whole point of the factory.
        run: >
          dotnet ef migrations script --idempotent
          --project TangentAtlas.LedgerService/TangentAtlas.LedgerService.csproj
          --output migration.sql

      - name: Azure login as migrator (OIDC - no client secret)
        # This identity has ONE narrow RBAC role - 'SQL Security Manager'
        # on the SQL server only (see Deploy-ManagedIdentities.ps1) - needed
        # because the firewall-rule steps below are ARM operations, not
        # covered by the separate SQL data-plane grant
        # (db_ddladmin/db_datareader/db_datawriter) Deploy-AtlasDatabase.ps1
        # makes. allow-no-subscriptions stays as a safety net for Entra
        # role-propagation delay (the identity may be too fresh for the
        # role to be visible yet right after Deploy-ManagedIdentities.ps1) -
        # same replication-lag pattern seen elsewhere in this project.
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_MIGRATOR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Allow this runner through the SQL firewall (temporary)
        # GitHub-hosted runners are NOT covered by Azure SQL's "Allow Azure
        # services" exception - that only covers Azure-hosted compute. This
        # rule is scoped to just this run's own IP and removed in the
        # cleanup step below, regardless of outcome (if: always()).
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create \
            --resource-group "${{ env.SQL_RESOURCE_GROUP }}" \
            --server "${{ env.SQL_SERVER_NAME }}" \
            --name "github-actions-run-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"

      - name: Apply migration
        shell: pwsh
        run: |
          Install-Module SqlServer -Force -Scope CurrentUser -AllowClobber
          $accessToken = az account get-access-token --resource https://database.windows.net --query accessToken -o tsv
          Invoke-Sqlcmd -ServerInstance "${{ env.SQL_SERVER_NAME }}.database.windows.net" `
            -Database "${{ env.SQL_DATABASE_NAME }}" `
            -AccessToken $accessToken `
            -InputFile "migration.sql"

      - name: Remove temporary firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ env.SQL_RESOURCE_GROUP }}" \
            --server "${{ env.SQL_SERVER_NAME }}" \
            --name "github-actions-run-${{ github.run_id }}" || true

  build-and-deploy:
    needs: migrate-database   # transitively also waits on 'approval'
    runs-on: ubuntu-latest
    # Matches the federated credential's subject
    # (repo:<org>/<repo>:environment:production) - see Deploy-ManagedIdentities.ps1.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        run: >
          dotnet publish TangentAtlas.LedgerService/TangentAtlas.LedgerService.csproj
          --configuration Release
          --no-build
          --output ${{ github.workspace }}/publish

      - name: Azure login (OIDC - no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish
