# Releases the ledger server to production: build and test, migrate the database, then publish the code and deploy it.
#
#   Trigger:  push to the 'production' branch  (git checkout production && git merge main && git push origin production)
#             or run it by hand: Actions -> Deploy to Production -> Run workflow.
#
# Two identities, one per job, both trusted only for this repository's 'production' environment (federated credentials
# made by TangentAtlas.Platform's Deploy-ManagedIdentities.ps1, which also sets the variables used here):
#   - AZURE_MIGRATOR_CLIENT_ID  id-ledger-migrate-prod: DDL on the ledger database, and the SQL firewall.  Nothing else.
#   - AZURE_CLIENT_ID           id-ledger-deploy-prod:  deploy code to this one web app.  No SQL.
# The server's own identity (id-ledger-prod) reads and writes rows and never has DDL rights.
name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC sign-in to Azure; no secret anywhere
  contents: read

# One release at a time; a second waits rather than cancelling a migration halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  RESOURCE_GROUP: rg-platform-prod
  SQL_SERVER: sql-tangentatlas-prod
  SQL_DATABASE: sqldb-ledger-prod
  WEB_APP: app-tangentatlas-ledger-prod

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build TangentAtlas.LedgerService.sln --configuration Release

      # The SQL Server tests skip here: they need LocalDB (Windows) or a server named by BELLEROPHON_SQL_SERVER.
      - name: Test
        run: dotnet test --solution TangentAtlas.LedgerService.sln --configuration Release --no-build

  migrate:
    name: Migrate the database
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: |
          dotnet tool restore
          dotnet build TangentAtlas.LedgerService.sln --configuration Release

      - name: Sign in to Azure as the migrator
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_MIGRATOR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # GitHub's runners are not "Azure services" to the SQL firewall: let this run's address in, and only for this run.
      - name: Open the SQL firewall to this runner
        run: |
          RUNNER_IP=$(curl --silent --fail https://api.ipify.org)
          az sql server firewall-rule create --only-show-errors --output none \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" \
            --name "github-run-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"

      # Entity Framework applies any migration not yet in __EFMigrationsHistory; none pending is a no-op.  The token comes
      # from the Azure CLI session above (Active Directory Default), so the connection string holds no secret.  The
      # database may be paused (auto-pause): the first connections fail while it resumes, up to about a minute, so the
      # step tries again for up to two minutes.  Both this step and the next are safe to repeat.
      - name: Apply the migrations
        env:
          LEDGER_SCHEMA_CONNECTION: Server=tcp:${{ env.SQL_SERVER }}.database.windows.net,1433;Database=${{ env.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            dotnet ef database update --project src/AtlasLedger.Schema --configuration Release --no-build && exit 0
            echo "Attempt $attempt failed; the database may be resuming. Trying again in 20 seconds..."
            sleep 20
          done
          exit 1

      # Creates the writer's table types, which the server's identity is not allowed to create.
      - name: Prepare the database
        env:
          ConnectionStrings__Ledger: Server=tcp:${{ env.SQL_SERVER }}.database.windows.net,1433;Database=${{ env.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            dotnet run --project src/AtlasLedger.Server --configuration Release --no-build --no-launch-profile -- prepare-database && exit 0
            echo "Attempt $attempt failed; the database may be resuming. Trying again in 20 seconds..."
            sleep 20
          done
          exit 1

      - name: Close the SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete --only-show-errors \
            --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" \
            --name "github-run-${{ github.run_id }}" || true

  deploy:
    name: Publish and deploy
    needs: migrate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The commit is stamped into the assembly (served at /version), so every running server traces back to the exact
      # source it was built from.  App Service runs it on its own .NET 10 runtime: no image and no registry.
      - name: Publish
        run: dotnet publish src/AtlasLedger.Server --configuration Release --output publish -p:SourceRevisionId=${{ github.sha }}

      - name: Sign in to Azure as the deployer
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The app admits only the operator's address, and its deployment site (scm) follows the same rules, so let this
      # runner in before deploying, and only for this run.
      - name: Let this runner reach the app (temporary)
        run: |
          RUNNER_IP=$(curl --silent --fail https://api.ipify.org)
          az webapp config access-restriction add --only-show-errors --output none \
            --name "$WEB_APP" --resource-group "$RESOURCE_GROUP" \
            --rule-name "github-run-${{ github.run_id }}" --action Allow --priority 200 \
            --ip-address "$RUNNER_IP/32"

      # Zip deployment with the deployer's Entra token (no publishing password); App Service restarts the app on the new
      # code.
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP }}
          package: publish

      # Done when /version answers with this commit: the new server has loaded its tenants and is the one serving.
      # A server that cannot load its tenants never answers, and the check fails after ten minutes.
      - name: Wait for the new server
        run: |
          HOST=$(az webapp show --name "$WEB_APP" --resource-group "$RESOURCE_GROUP" --query defaultHostName --output tsv)
          for attempt in $(seq 1 60); do
            RUNNING=$(curl --silent --max-time 10 "https://$HOST/version" || true)
            if [ "$RUNNING" = "${{ github.sha }}" ]; then
              echo "https://$HOST is running ${{ github.sha }}."
              exit 0
            fi
            echo "Waiting: https://$HOST answers '${RUNNING:-nothing}'..."
            sleep 10
          done
          echo "::error::The new build did not start within ten minutes. Its logs: portal, $WEB_APP, Log stream; or az webapp log tail --name $WEB_APP --resource-group $RESOURCE_GROUP"
          exit 1

      - name: Remove this runner's access
        if: always()
        run: |
          az webapp config access-restriction remove --only-show-errors --output none \
            --name "$WEB_APP" --resource-group "$RESOURCE_GROUP" \
            --rule-name "github-run-${{ github.run_id }}" || true
